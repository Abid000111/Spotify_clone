<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Musicify</title>
		<link rel="stylesheet" href="css/utility.css" />
		<link rel="stylesheet" href="css/style.css" />
		<link rel="stylesheet" href="css/style2.css" />
	</head>
	<body>
		<div id="cursor"></div>
		<div id="cursor-blur"></div>

		<div id="container" class="flex">
			<div class="left br10 flex column">
				<div id="upper" class="upper br10 flex column jS">
					<div id="spotify">
						<img src="svg/logo.svg" alt="Spotify" loading="lazy" />
						Musicify
					</div>
					<div id="home" class="svg">
						<img src="svg/home.svg" alt="Home" />
						Home
					</div>
					<div class="svg op">
						<div id="search_box">
							<input id="search_text" type="text" placeholder="Search" />
							<div id="search_icon">
								<img id="search_svg" src="svg/search.svg" alt="Search" />
							</div>
						</div>
					</div>
				</div>
				<div class="bottom br10">
					<div id="song_name"></div>
					<div class="visualizer" id="visualizer">
						<!-- Bars and balls will be generated dynamically -->
					</div>
				</div>
			</div>
			<div class="right br10">
				<div class="nav flex aC jS w100 trp psab">
					<div class="nav_button">
						<div id="back" class="back_arrow">
							<img src="svg/arrow.svg" alt="" />
							<div id="back_hidden" class="back_hidden">Go back</div>
						</div>
						<div id="forward" class="forward_arrow">
							<img src="svg/arrow.svg" alt="" />
							<div id="forward_hidden" class="forward_hidden">Go forward</div>
						</div>
					</div>
				</div>

				<div id="img">
					<div id="bg_img">
						<img />
					</div>
					<div id="info">
						<div id="name"></div>
						<div class="verified">
							<img src="svg/verified.svg" alt="verified" />
							<p>Verified Artist</p>
						</div>
						<div id="listener"></div>
					</div>
				</div>
				<div id="bottom_sec">
					<div id="scroll_sec">
						<div id="btn_sec">
							<div id="list_play_btn">
								<img src="svg/play.svg" alt="Play" />
							</div>
							<div id="follow">
								<button id="follow_btn">Follow</button>
								<div id="follow_act">Website is under development</div>
							</div>
							<div id="three_dot_section">
								<div id="three_dot">
									<p>
										<svg
											class="three_dot_svg"
											xmlns="http://www.w3.org/2000/svg"
											viewBox="0 0 24 24"
											fill="currentColor"
										>
											<path
												d="M5 10C3.9 10 3 10.9 3 12C3 13.1 3.9 14 5 14C6.1 14 7 13.1 7 12C7 10.9 6.1 10 5 10ZM19 10C17.9 10 17 10.9 17 12C17 13.1 17.9 14 19 14C20.1 14 21 13.1 21 12C21 10.9 20.1 10 19 10ZM12 10C10.9 10 10 10.9 10 12C10 13.1 10.9 14 12 14C13.1 14 14 13.1 14 12C14 10.9 13.1 10 12 10Z"
											></path>
										</svg>
									</p>
								</div>
								<div id="three_dot_hover">hjbjfgyfguyffyu</div>
								<div id="three_dot_drop_down">
									<div class="three_dot_option three_dot_option2">Follow</div>
									<div class="three_dot_option three_dot_option2">
										Go to artist radio
									</div>
									<div class="three_dot_option three_dot_option2">Report</div>
									<div id="three_dot_option_active">Website is under development</div>
									<div id="three_share" class="three_dot_option">
										Share
										<div id="share_sub_option">
											<div class="share_sub_option_item">Share on Facebook</div>
											<div class="share_sub_option_item">Share on Twitter</div>
											<div class="share_sub_option_item">Share on LinkedIn</div>
											<div id="share_sub_option_item_active">
												Website is under development
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
						<div class="list_section">
							<div id="list_container">
								<h2>Popular</h2>
							</div>
							<div class="artist_post">Artist pick</div>
						</div>
					</div>

					<div id="play_bar">
						<div class="song_buttons">
							<img id="repeat" src="svg/repeat.svg" alt="reapeat button" />
							<img id="previous" src="svg/previous.svg" alt="previous button" />
							<img id="play" alt="play button" />
							<!-- <img id="pause" src="pause.svg" alt="play button" /> -->
							<img id="next" src="svg/next.svg" alt="next button" />
							<img id="shuffle" src="svg/shuffle.svg" alt="shuffle button" />
						</div>
						<div id="seekBox">
							<div id="time_played">00:00</div>
							<div class="seekbar">
								<div id="golden"></div>
								<div id="circle"></div>
							</div>
							<div id="total_time">00:00</div>
						</div>
						<div class="song_info">
							<div id="scroller-in-1">
								<h1></h1>
								<h1></h1>
								<h1></h1>
								<h1></h1>
							</div>
							<div id="scroller-in-2">
								<h1></h1>
								<h1></h1>
								<h1></h1>
								<h1></h1>
							</div>
						</div>
						<div class="volume_control">
							<img id="volume_icon" src="svg/volume.svg" alt="Volume" />
							<input id="volume" type="range" min="0" max="1" step="0.01" value="1" />
						</div>
					</div>
				</div>
			</div>
		</div>

		<script src="script.js"></script>
	</body>
</html>
